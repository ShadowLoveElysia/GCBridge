name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    name: Static checks (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare external directories
        id: paths
        run: node scripts/prepare-ci.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install pinned dependencies outside checkout
        shell: bash
        run: npm --prefix "$GC_BRIDGE_DEPS_DIR" ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: bun run check
      - name: Source lint
        run: bun run lint
      - name: Browser JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/workspace.js
      - name: Credential and repository artifact scan
        run: bun src/release-check.ts
