name: build-desktop-binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.artifact }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64-baseline
            bun_distribution: bun-windows-x64-baseline
            artifact: GCBridge-windows-x64
          - os: macos-15
            target: bun-darwin-arm64
            bun_distribution: bun-darwin-aarch64
            artifact: GCBridge-macos-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            bun_distribution: bun-darwin-x64
            artifact: GCBridge-macos-x64
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            bun_distribution: bun-linux-x64-baseline
            artifact: GCBridge-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare external directories
        id: paths
        run: node scripts/prepare-ci.mjs
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: '1.4.5'
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/${{ matrix.bun_distribution }}.zip
      - name: Install pinned build dependencies
        shell: bash
        run: npm --prefix "$GC_BRIDGE_DEPS_DIR" ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: bun run check
      - name: Source lint
        run: bun run lint
      - name: Browser JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/workspace.js
      - name: Credential and repository artifact scan
        run: bun src/release-check.ts
      - name: Compile standalone application
        env:
          GC_BRIDGE_COMPILE_RUNTIME: ${{ steps.bun.outputs.bun-path }}
        run: bun scripts/build.ts ${{ matrix.target }}
      - name: Package native application
        run: bun scripts/package.ts
      - name: Remove build intermediates from distributable
        run: node -e "require('node:fs').rmSync(require('node:path').join(process.env.GC_BRIDGE_BUILD_DIR,'embedded'),{recursive:true,force:true})"
      - name: Upload compiled application and notices
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.paths.outputs.artifact_dir }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
